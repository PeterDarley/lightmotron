<div id="models-form">
    <h6 class="mt-0 mb-3">Models</h6>

    <div class="mb-3">
        <div class="list-group">
            {% for name in models %}
            <div class="list-group-item d-flex justify-content-between align-items-center">
                <div>
                    <span class="ms-2">{{ name }}</span>
                </div>
                <div>
                    <form class="d-inline-block" hx-post="/models" hx-target="#modal-body" hx-swap="innerHTML">
                        <input type="hidden" name="name" value="{{ name }}">
                        {% if name == current_model %}
                        <span class="badge bg-primary">Active</span>
                        <button type="submit" class="btn btn-sm btn-outline-secondary ms-2" name="action" value="set" disabled>Set</button>
                        {% else %}
                        <button type="submit" class="btn btn-sm btn-outline-secondary ms-2" name="action" value="set">Set</button>
                        {% endif %}
                    </form>

                    <form class="d-inline-block ms-2" hx-post="/models" hx-target="#modal-body" hx-swap="innerHTML">
                        <input type="hidden" name="name" value="{{ name }}">
                        <input type="text" name="new_name" class="form-control form-control-sm d-inline-block" style="width:10rem" placeholder="Rename to…">
                        <button type="submit" class="btn btn-sm btn-outline-secondary ms-1" name="action" value="rename">Rename</button>
                    </form>

                    <form class="d-inline-block ms-1" hx-post="/confirm" hx-target="#modal-body" hx-swap="innerHTML">
                        <input type="hidden" name="object_type" value="Model">
                        <input type="hidden" name="object_name" value="{{ name }}">
                        <input type="hidden" name="action_path" value="/models">
                        <input type="hidden" name="name" value="{{ name }}">
                        <button type="submit" class="btn btn-sm btn-outline-danger">Delete</button>
                    </form>
                </div>
            </div>
            {% endfor %}
        </div>
    </div>

    <hr />

    <form class="mt-3" hx-post="/models" hx-target="#modal-body" hx-swap="innerHTML">
        <div class="input-group input-group-sm">
            <input type="text" class="form-control form-control-sm" name="name" placeholder="New model name">
            <button class="btn btn-sm btn-outline-secondary" type="submit" name="action" value="create">Create</button>
        </div>
    </form>
</div>
