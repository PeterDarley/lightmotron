<div id="models-manager">
    <form hx-post="/models"
          hx-target="#models-manager"
          hx-swap="outerHTML">
        <input type="hidden" name="action" value="create">
        <div class="input-group mb-3" style="max-width: 400px;">
            <input type="text" class="form-control" name="name" placeholder="New model name" required>
            <button type="submit" class="btn btn-primary">Create Model</button>
        </div>
    </form>

    {% if models %}
    <table class="table table-hover align-middle mb-0">
        <thead>
            <tr>
                <th>Model</th>
                <th style="width: 200px;"></th>
            </tr>
        </thead>
        <tbody>
            {% for name in models %}
            <tr>
                <td>
                    <strong>{{ name }}</strong>
                    {% if name == current_model %}
                    <span class="badge bg-primary ms-2">Active</span>
                    {% endif %}
                </td>
                <td class="text-end">
                    {% if name != current_model %}
                    <form class="d-inline" hx-post="/models" hx-target="#models-manager" hx-swap="outerHTML">
                        <input type="hidden" name="name" value="{{ name }}">
                        <input type="hidden" name="action" value="set">
                        <button type="submit" class="btn btn-sm btn-outline-secondary me-1">Set</button>
                    </form>
                    {% endif %}
                    <button class="btn btn-sm btn-outline-primary me-1"
                            hx-get="/models/edit?name={{ name }}"
                            hx-target="#modal-body"
                            hx-swap="innerHTML">
                        Rename
                    </button>
                    <button class="btn btn-sm btn-outline-danger"
                            hx-post="/confirm"
                            hx-target="#modal-body"
                            hx-swap="innerHTML"
                            hx-vals='{"object_type": "Model", "object_name": "{{ name }}", "action_path": "/models", "name": "{{ name }}"}'
                            hx-confirm="Delete model '{{ name }}'?">
                        Delete
                    </button>
                </td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
    {% else %}
    <p class="text-muted small mt-2">No models yet. Create one above.</p>
    {% endif %}
</div>
