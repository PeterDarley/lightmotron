{% if named_ranges %}
<div class="d-flex flex-wrap gap-1 mb-0">
    {% for r in named_ranges %}
    <span class="badge bg-secondary">{{ r.name }} <span class="text-muted fw-normal">{{ r.summary }}</span></span>
    {% endfor %}
</div>
{% else %}
<small class="text-muted">No ranges defined yet.</small>
{% endif %}
