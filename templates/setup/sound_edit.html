<div id="sound-editor">
    <div class="d-flex align-items-center mb-3">
        <button class="btn btn-outline-secondary btn-sm me-3"
                hx-get="/sounds"
                hx-target="#modal-body"
                hx-swap="innerHTML">
            &larr; Back to Sounds
        </button>
        <h5 class="mb-0">{{ sound_title }}</h5>
    </div>

    <form hx-post="/sounds/edit"
          hx-target="#modal-body"
          hx-swap="innerHTML">
        <input type="hidden" name="action" value="update_sound">
        <input type="hidden" name="old_sound_title" value="{{ sound_title }}">

        <div class="mb-3">
            <label for="sound-title-input" class="form-label">Title</label>
            <input type="text" class="form-control" id="sound-title-input" name="sound_title"
                   value="{{ sound_title }}"
                   placeholder="Sound name" maxlength="64" required style="max-width: 400px;">
            <small class="text-muted">Display name for this sound (shown in UI)</small>
        </div>

        <div class="mb-3">
            <label for="sound-file-input" class="form-label">File #</label>
            <input type="number" class="form-control" id="sound-file-input" name="sound_file"
                   value="{{ sound_file }}"
                   min="1" max="9999" required style="max-width: 200px;">
            <small class="text-muted">SD card file number (0001-9999)</small>
        </div>

        <div class="mb-3 form-check">
            <input type="checkbox" class="form-check-input theme-check" id="sound-hq-checkbox" name="sound_high_quality" value="1"{% if sound_high_quality %} checked{% endif %}>
            <label class="form-check-label theme-check-label" for="sound-hq-checkbox">
                High Quality
            </label>
            <br><small class="text-muted">Use high-quality audio file if available</small>
        </div>

        <div class="mb-3 form-check">
            <input type="checkbox" class="form-check-input theme-check" id="sound-home-checkbox" name="sound_show_on_home" value="1"{% if sound_show_on_home %} checked{% endif %}>
            <label class="form-check-label theme-check-label" for="sound-home-checkbox">
                Show on Home Page
            </label>
            <br><small class="text-muted">Display this sound as a button on the home page</small>
        </div>

        <div class="d-flex gap-2 mt-4">
            <button type="submit" class="btn btn-primary">
                Save Sound
            </button>
            <button type="button"
                    class="btn btn-outline-secondary"
                    hx-get="/sounds"
                    hx-target="#modal-body"
                    hx-swap="innerHTML">
                Cancel
            </button>
        </div>
    </form>
</div>
