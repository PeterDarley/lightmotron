<div id="sound_buttons"
    class="theme-scene-buttons theme-sound-buttons"
    hx-get="/sounds/status"
    hx-trigger="every {{ sounds_poll_interval_seconds }}s"
    hx-swap="outerHTML">
    <div class="d-flex align-items-center justify-content-end mb-2">
        {% if sounds %}
            <form hx-post="/sounds/stop-all"
                  hx-target="#sound_buttons"
                  hx-swap="outerHTML">
                <button type="submit" class="btn btn-sm btn-outline-danger theme-stop-all-btn">
                    &#9632; Stop All
                </button>
            </form>
        {% endif %}
    </div>
    <div class="d-flex align-items-center gap-3 flex-wrap mb-3">
        <label for="master-volume" class="form-label theme-audio-label text-muted small mb-0">Volume</label>
        <div class="d-flex align-items-center gap-2">
            <input type="range" id="master-volume" name="master-volume" class="form-range theme-volume-slider"
                   min="0" max="30" value="{{ current_volume }}"
                   hx-post="/audio/volume"
                   hx-trigger="change"
                   hx-target="#volume-feedback"
                   hx-swap="innerHTML"
                   oninput="document.getElementById('volume-feedback').textContent = this.value + '/30'">
            <span class="small text-muted theme-volume-value" id="volume-feedback">{{ current_volume }}/30</span>
        </div>
    </div>
    {% if sounds %}
        <div class="theme-section-actions d-flex flex-wrap gap-2">
            {% for sound in sounds %}
            <div id="sound-{{ sound.file }}-result">
                {% if sound.is_playing %}
                <form hx-post="/sounds/stop"
                      hx-target="#sound-{{ sound.file }}-result"
                      hx-swap="innerHTML">
                    <input type="hidden" name="module_idx" value="{{ sound.module_idx }}">
                    <input type="hidden" name="title" value="{{ sound.title }}">
                    <input type="hidden" name="file" value="{{ sound.file }}">
                    <button type="submit" class="btn btn-sm btn-danger theme-sound-stop-btn">
                        &#9632; {{ sound.title }}
                    </button>
                </form>
                {% else %}
                <form hx-post="/sounds/play"
                      hx-target="#sound-{{ sound.file }}-result"
                      hx-swap="innerHTML">
                    <input type="hidden" name="title" value="{{ sound.title }}">
                    <button type="submit" class="theme-sound-btn btn btn-sm btn-outline-primary">
                        {{ sound.title }}
                    </button>
                </form>
                {% endif %}
            </div>
            {% endfor %}
        </div>
    {% else %}
    <div class="small text-muted">No home-visible sounds configured.</div>
    {% endif %}
</div>
