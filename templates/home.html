{% include 'base/base_head.html' %}
<div class="theme-page container mt-4">
    <div class="theme-home-stack">
        <div class="card theme-home-section theme-system-panel">
            <div class="accordion" id="system-accordion">
                <div class="accordion-item">
                    <h2 class="accordion-header">
                        <button class="accordion-button collapsed card-header theme-system-toggle" type="button"
                                data-bs-toggle="collapse" data-bs-target="#system-collapse"
                                aria-expanded="false" aria-controls="system-collapse">
                            <svg class="theme-gear-icon" width="18" height="18" viewBox="0 0 24 24"
                                 fill="currentColor" aria-hidden="true" focusable="false">
                                <defs>
                                    <mask id="gear-hole">
                                        <rect width="24" height="24" fill="#fff"/>
                                        <circle cx="12" cy="12" r="3" fill="#000"/>
                                    </mask>
                                </defs>
                                <g mask="url(#gear-hole)">
                                    <circle cx="12" cy="12" r="7"/>
                                    <rect x="10" y="0.5" width="4" height="5" rx="1"/>
                                    <rect x="10" y="18.5" width="4" height="5" rx="1"/>
                                    <rect x="0.5" y="10" width="5" height="4" rx="1"/>
                                    <rect x="18.5" y="10" width="5" height="4" rx="1"/>
                                    <rect x="10" y="0.5" width="4" height="5" rx="1" transform="rotate(45 12 12)"/>
                                    <rect x="10" y="0.5" width="4" height="5" rx="1" transform="rotate(135 12 12)"/>
                                    <rect x="10" y="0.5" width="4" height="5" rx="1" transform="rotate(225 12 12)"/>
                                    <rect x="10" y="0.5" width="4" height="5" rx="1" transform="rotate(315 12 12)"/>
                                </g>
                            </svg>
                            <span class="ms-2">System</span>
                        </button>
                    </h2>
                    <div id="system-collapse" class="accordion-collapse collapse" data-bs-parent="#system-accordion">
                        <div class="card-body">
                            <h6 class="theme-section-heading">Animation</h6>
                            <div class="d-flex align-items-center gap-3 flex-wrap mb-4">
                                {% include 'animation/buttons.html' %}
                            </div>

                            <h6 class="theme-section-heading">Brightness</h6>
                            <div class="theme-slider-row">
                                <label for="brightness-slider" class="form-label small mb-0 theme-brightness-label">Brightness</label>
                                <input type="range" class="form-range" id="brightness-slider" name="brightness"
                                       min="0" max="100" step="1" value="{{ brightness_percent }}"
                                      
                                       oninput="document.getElementById('brightness-value').textContent = this.value + '%'"
                                       hx-post="/brightness"
                                       hx-trigger="change"
                                       hx-swap="none">
                                <span id="brightness-value" class="small text-muted">{{ brightness_percent }}%</span>
                            </div>

                            <h6 class="theme-section-heading">Volume</h6>
                            <div class="theme-slider-row">
                                <label for="soundscape-master-volume" class="form-label theme-audio-label text-muted small mb-0">Volume</label>
                                <input type="range" id="soundscape-master-volume" name="master-volume" class="form-range theme-volume-slider theme-soundscape-volume-slider"
                                       min="0" max="30" value="{{ current_volume }}"
                                       hx-post="/audio/volume"
                                       hx-trigger="change"
                                       hx-target="#soundscape-volume-feedback"
                                       hx-swap="innerHTML"
                                       oninput="document.getElementById('soundscape-volume-feedback').textContent = this.value + '/30'">
                                <span class="small text-muted theme-volume-value" id="soundscape-volume-feedback">{{ current_volume }}/30</span>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        {% include 'scenes/scene_panel.html' %}
        <div class="card theme-home-section theme-soundscapes-panel">
            <div class="card-header">Soundscapes</div>
            <div class="card-body">
                {% include 'soundscapes/buttons.html' %}
            </div>
        </div>
    </div>
</div>
{% include 'base/base_foot.html' %}
