{% include 'base/base_head.html' %}
<div class="theme-page container mt-4">
    <div class="theme-home-stack">
        <div class="card theme-home-section theme-animation-panel">
            <div class="card-header">Animation</div>
            <div class="card-body d-flex align-items-center gap-3 flex-wrap">
                {% include 'animation/buttons.html' %}
            </div>
        </div>
        <div class="card theme-home-section theme-brightness-panel">
            <div class="card-header">Brightness</div>
            <div class="card-body d-flex align-items-center gap-3">
                <input type="range" class="form-range" id="brightness-slider" name="brightness"
                       min="0" max="100" step="1" value="{{ brightness_percent }}"
                       style="max-width: 320px;"
                       oninput="document.getElementById('brightness-value').textContent = this.value + '%'"
                       hx-post="/brightness"
                       hx-trigger="change"
                       hx-swap="none">
                <span id="brightness-value" class="small text-muted">{{ brightness_percent }}%</span>
            </div>
        </div>
        {% include 'scenes/scene_panel.html' %}
        <div class="card theme-home-section theme-soundscapes-panel">
            <div class="card-header">Soundscapes</div>
            <div class="card-body">
                {% include 'soundscapes/buttons.html' %}
            </div>
        </div>
    </div>
</div>
{% include 'base/base_foot.html' %}
